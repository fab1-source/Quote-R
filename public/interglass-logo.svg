<svg viewBox="0 0 740 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="igc-banner-emblem-clip">
      <ellipse cx="60" cy="38" rx="54" ry="33" />
    </clipPath>
  </defs>

  <!-- Left: IGC Striped Emblem -->
  <g id="igc-emblem">
    <ellipse cx="60" cy="38" rx="54" ry="33" fill="#FFFFFF" />
    <g clip-path="url(#igc-banner-emblem-clip)">
      <rect x="0" y="7" width="120" height="3.5" fill="#7B1818" />
      <rect x="0" y="13.5" width="120" height="3.5" fill="#7B1818" />
      <rect x="0" y="20" width="120" height="3.5" fill="#7B1818" />
      <rect x="0" y="26.5" width="120" height="3.5" fill="#7B1818" />
      <rect x="0" y="33" width="120" height="3.5" fill="#7B1818" />
      <rect x="0" y="39.5" width="120" height="3.5" fill="#7B1818" />
      <rect x="0" y="46" width="120" height="3.5" fill="#7B1818" />
      <rect x="0" y="52.5" width="120" height="3.5" fill="#7B1818" />
      <rect x="0" y="59" width="120" height="3.5" fill="#7B1818" />
      <rect x="0" y="65.5" width="120" height="3.5" fill="#7B1818" />
    </g>
    <ellipse cx="60" cy="38" rx="32" ry="17" fill="#FFFFFF" />
    <text x="60" y="46" fill="#7B1818" font-family="'Times New Roman', Times, Georgia, serif" font-size="26" font-weight="bold" font-style="italic" letter-spacing="1.5" text-anchor="middle">IGC</text>
    <ellipse cx="60" cy="38" rx="54" ry="33" fill="none" stroke="#7B1818" stroke-width="1.6" />
  </g>

  <!-- Right: Company Name -->
  <g id="company-name">
    <text x="138" y="46" fill="#7B1818" font-family="'Times New Roman', Times, Georgia, serif" font-size="34" font-weight="bold" font-style="italic" letter-spacing="3.5">INTERGLASS CO. LLC</text>
    <line x1="136" y1="55" x2="725" y2="55" stroke="#7B1818" stroke-width="1.6" />
  </g>

  <!-- Subtitle: QUOTATION -->
  <g id="quotation-title">
    <text x="430" y="81" fill="#0B3868" font-family="'Times New Roman', Times, Georgia, serif" font-size="22" font-weight="bold" letter-spacing="2.5" text-anchor="middle">QUOTATION</text>
    <line x1="340" y1="86" x2="520" y2="86" stroke="#0B3868" stroke-width="1.4" />
  </g>
</svg>
